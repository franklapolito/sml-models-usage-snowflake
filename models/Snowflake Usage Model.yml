unique_name: Snowflake Usage Model
object_type: model
label: Snowflake Usage Model
dimensions:
  - Query
include_default_drillthrough: true
metrics:
  - unique_name: m_BYTES_SCANNED_avg
    folder: Measures - Averages
  - unique_name: m_BYTES_SCANNED_sum
    folder: Measures - Totals
  - unique_name: m_COMPILATION_TIME_avg
    folder: Measures - Averages
  - unique_name: m_CREDITS_USED_sum
    folder: Measures - Totals
  - unique_name: m_EXECUTION_TIME_avg
    folder: Measures - Averages
  - unique_name: m_EXECUTION_TIME_sum
    folder: Measures - Totals
  - unique_name: m_QUERY_ID_distinct
    folder: Measures - Counts
  - unique_name: m_ROWS_PRODUCED_avg
    folder: Measures - Averages
  - unique_name: m_ROWS_PRODUCED_sum
    folder: Measures - Totals
  - unique_name: m_TOTAL_ELAPSED_TIME_avg
    folder: Measures - Averages
  - unique_name: m_TOTAL_ELAPSED_TIME_sum
    folder: Measures - Totals
  - unique_name: Total Cost
    folder: Measures - Totals
relationships:
  - unique_name: QUERY_HISTORY_Date_Dimension
    from:
      dataset: query_history
      join_columns:
        - START_DATE
    to:
      dimension: Date Dimension
      level: full_date
  - unique_name: WAREHOUSE_METERING_HISTORY_Date_Dimension
    from:
      dataset: warehouse_metering_history
      join_columns:
        - START_DATE
    to:
      dimension: Date Dimension
      level: full_date
  - unique_name: QUERY_HISTORY_WAREHOUSE_ID_to_Warehouse_Warehouse Level
    from:
      dataset: query_history
      join_columns:
        - WAREHOUSE_ID
    to:
      dimension: Warehouse
      level: Warehouse Level
  - unique_name: WAREHOUSE_METERING_HISTORY_WAREHOUSE_ID_to_Warehouse_Warehouse Level
    from:
      dataset: warehouse_metering_history
      join_columns:
        - WAREHOUSE_ID
    to:
      dimension: Warehouse
      level: Warehouse Level
  - unique_name: QUERY_HISTORY_USER_NAME_to_User_User Name
    from:
      dataset: query_history
      join_columns:
        - USER_NAME
    to:
      dimension: User
      level: User Name
  - unique_name: QUERY_HISTORY_DATABASE_ID_to_Data_Database
    from:
      dataset: query_history
      join_columns:
        - DATABASE_ID
    to:
      dimension: Data
      level: Database
